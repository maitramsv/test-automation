name: Handle External Dispatch

on:
  repository_dispatch:
    types: [my-custom-event] # The name of your event

jobs:
  commit-json:
    runs-on: ubuntu-latest
    
    # Grant permissions to write/commit back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Save Client Payload to JSON File
        run: |
          # Write the JSON payload directly into a file (e.g., data/excel_output.json)
          mkdir -p data
          echo '${{ toJson(github.event.client_payload) }}' > data/excel_output.json

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update excel output from Power Automate dispatch"
          file_pattern: "data/excel_output.json"
